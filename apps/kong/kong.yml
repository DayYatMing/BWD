_format_version: "3.0"

#CONSUMER APPS
services:
  - name: broker-otrs
    url: http://brokerotrs:3000
    routes:
      - name: broker-otrs-route
        paths:
          - /otrs
          - /management
        strip_path: false

  - name: broker-ai
    url: http://brokerai:3100
    routes:
      - name: broker-ai-route
        paths:
          - /broker_ai
        strip_path: false

  - name: broker-grafana
    url: http://brokergrafana:3200
    routes:
      - name: broker-grafana-route
        paths:
          - /api
        strip_path: false

  - name: broker-ciena
    url: http://brokerciena:3300
    routes:
      - name: broker-ciena-route
        paths:
          - /ncs
        strip_path: false


plugins:
  # API KEY AUTHENTICATION
  - name: key-auth
    service: broker-otrs
    config:
      key_names:
        - apikey
      hide_credentials: true

  - name: key-auth
    service: broker-ai
    config:
      key_names:
        - apikey
      hide_credentials: true


  - name: key-auth
    service: broker-grafana
    config:
      key_names:
        - apikey
      hide_credentials: true

  - name: key-auth
    service: broker-ciena
    config:
      key_names:
        - apikey
      hide_credentials: true

  # ACL GROUP CHECK
  - name: acl
    service: broker-otrs
    config:
      allow:
        - nms
        - cms
        - ticketing

  - name: acl
    service: broker-ai
    config:
      allow:
        - nms

  - name: acl
    service: broker-grafana
    config:
      allow:
        - cms

  - name: acl
    service: broker-ciena
    config:
      allow:
        - nms


#CLIENT APPS
consumers:
  - username: nms-app
    keyauth_credentials:
      - key: Hardware-0-Unbolted-0-Cufflink-0-Concierge-0-Unproven-0-Uneasy-0-Wham-0-Visibly
    acls:
      - group: nms

  - username: cms-app
    keyauth_credentials:
      - key: Hardware-1-Unbolted-2-Cufflink-3-Concierge-4-Unproven-5-Uneasy-6-Wham-7-Visibly
    acls:
      - group: cms

  - username: ticketing-app
    keyauth_credentials:
      - key: Software-1-Bolted-1-Pufflink-1-Counter-1-Proven-1-Difficult-1-Whole-1-Invisibly
    acls:
      - group: ticketing
