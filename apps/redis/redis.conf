# Enable persistence
appendonly yes

# Save snapshots as well (optional, enabled by default)
save 900 1
save 300 10
save 60 10000

# Memory limit
maxmemory 128mb

# Eviction policy
maxmemory-policy allkeys-lru

# Authentication
requirepass Implementation-5-With-0-Default-2-Settings-3-Is-6-Not-7-A-8-Good-1-Idea



