<div>
  <h6 style="color: red">{{ infoMsg }}</h6>
</div>
<div style="width: 100%; text-align: center">
  <h1>Room Location</h1>
</div>
<!-- Loader -->
<div *ngIf="progressLoader" class="loader">
  <div class="spinner"></div>
</div>
<div *ngIf="!progressLoader">
  <div class="tablegrid" style="width: 100%; height: 100%">
    <ejs-grid
      #roomlocationgrid
      id="roomlocationgrid"
      gridLines="Horizontal"
      [dataSource]="roomlocations"
      allowSorting="true"
      allowPaging="true"
      allowTextWrap="true"
      [height]="520"
      [pageSettings]="pageSettings"
      [toolbar]="toolbar"
      [editSettings]="editSettings"
      [selectionSettings]="selectionOptions"
      [allowSelection]="true"
      [contextMenuItems]="contextMenuItems"
      (actionComplete)="actionComplete($event)"
      (rowSelected)="rowSelected($event)">
      <e-columns>
        <e-column field="id" headerText="ID" width="120" textAlign="Left" [visible]="false"></e-column>
        <e-column field='site'   isPrimaryKey='true'  headerText='Site' width='120' textAlign='Left'  ></e-column>
        <e-column field='labelname'  headerText='Room' width='120' textAlign='Left'  isPrimaryKey='true' ></e-column>
        <e-column field='comment' headerText='Comment' width='500' textAlign='Left'   ></e-column>
      </e-columns>
    </ejs-grid>
  </div>
</div>
