<div class="banner banner-page u-bg-gradient">
  <div class="banner-body">
    <div class="container">
      <h1 class="banner-heading h1">Welcome to BW Digital Customer Portal</h1>
    </div>
  </div>
</div>

<div class="d-flex justify-content-center py-5">
  <div class="col-lg-4 col-md-6 col-sm-8">
    <div class="card shadow border-0 rounded-3">
      <div class="card-body p-4">
        <h4 class="text-center fw-semibold" data-cy="loginTitle" jhiTranslate="login.title">Sign into your account</h4>

        @if (authenticationError()) {
          <div class="alert alert-danger text-center py-2" data-cy="loginError">
            <strong>Failed to sign in!</strong>
          </div>
        }
        <form (ngSubmit)="login()" [formGroup]="loginForm" *ngIf="!mfaRequired()">
          <div class="mb-3">
            <label class="form-label small fw-semibold" for="username" jhiTranslate="global.form.username.label">Username</label>
            <input type="text" class="form-control rounded-2" id="username" formControlName="username" data-cy="username" />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold" for="password" jhiTranslate="login.form.password"> Password </label>
            <input type="password" class="form-control rounded-2" id="password" formControlName="password" data-cy="password" />
          </div>

          <div class="form-check mb-3 small">
            <input class="form-check-input" type="checkbox" id="rememberMe" formControlName="rememberMe" />
            <label class="form-check-label" for="rememberMe" jhiTranslate="login.form.rememberme"> Remember me </label>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-primary" data-cy="submit" jhiTranslate="login.form.button">Sign in</button>
          </div>
        </form>

        <div *ngIf="mfaRequired()">
          <form (ngSubmit)="verifyMfa()" [formGroup]="mfaForm">
            <div class="mb-3">
              <label>Enter MFA Code</label>
              <input type="text" class="form-control" formControlName="code" placeholder="6-digit code" maxlength="6" />
            </div>
            <button type="submit" class="btn btn-success" [disabled]="mfaForm.invalid">Verify</button>
          </form>
          <!-- Back to Login -->
          <button type="button" (click)="cancelMfa()" class="btn btn-warning mt-2">Back to Login</button>
        </div>

        <div class="mt-3 text-center small">
          <a
            routerLink="/account/reset/request"
            data-cy="forgetYourPasswordSelector"
            class="d-block mb-2"
            jhiTranslate="login.password.forgot"
          >
            Forgot password?
          </a>
          <!--          <span jhiTranslate="global.messages.info.register.noaccount"> No account?</span>-->
          <!--          <a routerLink="/account/register" class="fw-semibold" jhiTranslate="global.messages.info.register.link"> Register </a>-->
        </div>
      </div>
    </div>
  </div>
</div>
