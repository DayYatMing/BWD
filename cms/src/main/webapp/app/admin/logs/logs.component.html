@defer (when loggers() && !isLoading()) {
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
      <h2 id="logs-page-heading" data-cy="logsPageHeading" class="mb-2 mb-md-0 fw-bold">
        <span jhiTranslate="logs.title">Logs</span>
      </h2>
    </div>

    <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
      <div class="d-flex gap-2 align-items-center">
        <span jhiTranslate="logs.filter">Filter</span>
        <input
          type="text"
          class="form-control w-auto"
          placeholder="Enter text to filter"
          [ngModel]="filter()"
          (ngModelChange)="filter.set($event)"
        />
      </div>

      <div class="d-flex gap-2 align-items-center">
        <span>Service</span>
        <select class="form-select" (change)="changeService($event)">
          <option [ngValue]="null"></option>
          @for (service of services; track $index) {
            <option [value]="service">{{ service }}</option>
          }
        </select>
      </div>
    </div>

    <p jhiTranslate="logs.nbloggers" [translateValues]="{ total: loggers()?.length }" class="mb-2">
      There are {{ loggers()?.length }} loggers.
    </p>

    <div class="table-responsive">
      <table class="table table-striped table-bordered table-sm" aria-describedby="logs-page-heading">
        <thead>
          <tr jhiSort [(sortState)]="sortState">
            <th jhiSortBy="name" scope="col">
              <span jhiTranslate="logs.table.name">Name</span> <fa-icon icon="sort" class="ms-1"></fa-icon>
            </th>
            <th jhiSortBy="level" scope="col">
              <span jhiTranslate="logs.table.level">Level</span> <fa-icon icon="sort" class="ms-1"></fa-icon>
            </th>
          </tr>
        </thead>

        <tbody>
          @for (logger of filteredAndOrderedLoggers(); track $index) {
            <tr>
              <td class="text-truncate" title="{{ logger.name }}">
                <small>{{ logger.name | slice: 0 : 140 }}</small>
              </td>
              <td>
                <div class="d-flex flex-wrap gap-1">
                  <button
                    (click)="changeLevel(logger.name, 'TRACE')"
                    [ngClass]="logger.level === 'TRACE' ? 'btn-primary' : 'btn-light'"
                    class="btn btn-sm"
                  >
                    TRACE
                  </button>
                  <button
                    (click)="changeLevel(logger.name, 'DEBUG')"
                    [ngClass]="logger.level === 'DEBUG' ? 'btn-success' : 'btn-light'"
                    class="btn btn-sm"
                  >
                    DEBUG
                  </button>
                  <button
                    (click)="changeLevel(logger.name, 'INFO')"
                    [ngClass]="logger.level === 'INFO' ? 'btn-info text-white' : 'btn-light'"
                    class="btn btn-sm"
                  >
                    INFO
                  </button>
                  <button
                    (click)="changeLevel(logger.name, 'WARN')"
                    [ngClass]="logger.level === 'WARN' ? 'btn-warning' : 'btn-light'"
                    class="btn btn-sm"
                  >
                    WARN
                  </button>
                  <button
                    (click)="changeLevel(logger.name, 'ERROR')"
                    [ngClass]="logger.level === 'ERROR' ? 'btn-danger' : 'btn-light'"
                    class="btn btn-sm"
                  >
                    ERROR
                  </button>
                  <button
                    (click)="changeLevel(logger.name, 'OFF')"
                    [ngClass]="logger.level === 'OFF' ? 'btn-secondary' : 'btn-light'"
                    class="btn btn-sm"
                  >
                    OFF
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
} @loading {
  <div class="d-flex justify-content-center my-4">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
}
