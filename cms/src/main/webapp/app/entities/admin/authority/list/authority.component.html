<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
    <h2 id="page-heading" data-cy="AuthorityHeading" class="mb-2 mb-md-0 fw-bold">
      <span jhiTranslate="cmsApp.adminAuthority.home.title">Authorities</span>
    </h2>

    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-info d-flex align-items-center shadow-sm" (click)="load()" [disabled]="isLoading">
        <fa-icon icon="sync" [animation]="isLoading ? 'spin' : undefined" class="me-2"></fa-icon>
        <span jhiTranslate="cmsApp.adminAuthority.home.refreshListLabel">Refresh list</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary d-flex align-items-center shadow-sm"
        [routerLink]="['/authority/new']"
      >
        <fa-icon icon="plus" class="me-2"></fa-icon>
        <span jhiTranslate="cmsApp.adminAuthority.home.createLabel">Create a new Authority</span>
      </button>
    </div>
  </div>

  <jhi-alert-error />
  <jhi-alert />

  @if (authorities().length === 0) {
    <div class="alert alert-warning shadow-sm rounded" id="no-result">
      <span jhiTranslate="cmsApp.adminAuthority.home.notFound">No Authorities found</span>
    </div>
  } @else {
    <div class="table-responsive shadow-sm rounded border">
      <table class="table table-hover align-middle mb-0" aria-describedby="page-heading">
        <thead class="table-light">
          <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
            <th scope="col" jhiSortBy="name" class="fw-semibold">
              <div class="d-flex align-items-center">
                <span jhiTranslate="cmsApp.adminAuthority.name">Name</span>
                <fa-icon icon="sort" class="ms-2 text-muted"></fa-icon>
              </div>
            </th>
            <th scope="col" class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (authority of authorities(); track trackName(authority)) {
            <tr data-cy="entityTable" class="align-middle">
              <td>
                <a (click)="view(authority, viewModal)" class="fw-semibold text-decoration-none text-primary">{{ authority.name }}</a>
              </td>
              <td class="text-end">
                <div class="btn-group">
                  <button
                    type="button"
                    class="btn btn-outline-primary btn-sm d-flex align-items-center me-1 shadow-sm"
                    (click)="view(authority, viewModal)"
                    data-cy="entityDetailsButton"
                  >
                    <fa-icon icon="eye" class="me-1"></fa-icon>
                    <span class="d-none d-md-inline" jhiTranslate="entity.action.view">View</span>
                  </button>
                  <button
                    type="submit"
                    (click)="delete(authority)"
                    class="btn btn-outline-danger btn-sm d-flex align-items-center shadow-sm"
                    data-cy="entityDeleteButton"
                  >
                    <fa-icon icon="times" class="me-1"></fa-icon>
                    <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Delete</span>
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>

<ng-template #viewModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" jhiTranslate="cmsApp.adminAuthority.detail.title">Authority Details</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body" *ngIf="selectedAuthority">
    <dl class="row mb-0">
      <dt class="col-sm-4 fw-semibold" jhiTranslate="cmsApp.adminAuthority.name">Name</dt>
      <dd class="col-sm-8 text-primary fw-semibold">{{ selectedAuthority.name }}</dd>
    </dl>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="modal.close()">
      <fa-icon icon="times" class="me-1"></fa-icon>
      <span jhiTranslate="entity.action.cancel">Cancel</span>
    </button>
  </div>
</ng-template>
